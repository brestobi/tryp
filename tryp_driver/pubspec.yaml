name: tryp_driver
description: "TRYP Driver App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  go_router: ^17.3.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  supabase_flutter: ^2.16.0
  dio: ^5.3.0
  flutter_paystack_plus: ^2.0.1
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.5.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.1.0
  intl: ^0.20.3
  logger: ^2.0.0
  json_annotation: ^4.8.0
  image_picker: ^1.2.3
  camera: ^0.11.0+2
  google_sign_in: ^6.2.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.7.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tryp_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/tryp_icon.png"
